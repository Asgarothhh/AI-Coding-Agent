schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: openJiuwen Challenge 2026 batch agent, команда «Стивенсон», агент Stevenson 1.0.
  Goal: maximize total reward under one global token budget; answer.txt is mandatory in every task directory.
  Runtime: Python 3.11, stdlib-only core, openjiuwen==0.1.20.post1 (openJiuwen Core SDK only).
  Hardware: 4 CPU, 16 GB RAM, no GPU, container <= 1 hour, image < 4 GB, build < 1000 s.
  Budget: one global budget only; no per-task cap and no per-task token budget.
  Cost formula: prompt_tokens/10 + completion_tokens; reasoning counts as completion once.
  Models: only qwen3.8-27b, qwen3.8-27b-noreason, qwen3.6-35b-a3b, qwen3.6-35b-a3b-noreason via LLM proxy.
  Container: read-only rootfs, HOME=/tmp, no network except LLM_BASE_URL.
  Entry point: python run_agent.py --tasks-dir /data/tasks
  Answer path: <TASKS>/<task_id>/answer.txt; diagnostics go to stderr and /tmp.
  Tests: python3.11 -m unittest discover -s tests; contract: -s tests/contract.
  Source material: specs/001-token-estimator/spec.md v5.0 is canonical; openjiuwen.md and *.tasks.yaml are historical v4.0.
  Team: three developers D1 (runtime/openJiuwen/budget/Docker), D2 (estimator/planner/policy), D3 (solvers/patch/store/test polygon) plus integrator.
  Freeze: code freeze 12.11.2026 18:00 MSK; safe submission 13.11.2026 18:00 MSK.
  Do not re-register the agent; registration is immutable.
  Do not commit secrets, team.json, or API keys.

rules:
  proposal:
    - Keep proposals under 700 words
    - Always state what is out of scope
  design:
    - Reference data contracts from spec.md v5.0 section 4 instead of redefining them
  tasks:
    - One commit per task, message starts with the task id
    - Every task names files, one verification command and one acceptance criterion
    - Group tasks by stages 0-5 from spec.md v5.0 section 14 and name the owner D1/D2/D3/Integrator

operations:
  apply:
    guidance:
      - Run the full unit and contract suites before marking a task done
      - Record measured numbers, not claims
  archive:
    guidance:
      - Summarize which specs were created or updated
